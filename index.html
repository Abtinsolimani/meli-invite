<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>دعوت به میلی | ۱ میلی هدیه</title>
  <meta name="description" content="با کد دعوت milli-efelz در میلی ثبت‌نام کنید و ۱ میلی هدیه بگیرید.">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#fffdf4,#f4f7ff);color:#111a55}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(560px,100%);background:#fff;border-radius:28px;padding:34px 24px;text-align:center;box-shadow:0 18px 55px #111a5520}
    img{width:210px;max-width:70%;margin:4px auto 18px;display:block}
    h1{font-size:28px;margin:8px 0 14px}
    p{font-size:17px;line-height:2;color:#444;margin:10px 0}
    .gift{display:inline-block;background:#fff4c7;border:1px solid #f0cf58;border-radius:16px;padding:12px 20px;font-weight:bold;color:#765900;margin:14px 0}
    .code{font-size:22px;letter-spacing:.5px;background:#f3f5ff;border:2px dashed #17256f;border-radius:14px;padding:14px;margin:10px 0 20px;font-weight:bold}
    .btn{display:block;text-decoration:none;background:#132275;color:#fff;padding:16px;border-radius:15px;font-size:18px;font-weight:bold;margin-top:12px}
    .btn:hover{background:#0d195d}
    .small{font-size:12px;color:#777;margin-top:18px;line-height:1.8}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img src="milli-logo.jpg" alt="لوگوی میلی">
      <h1>به میلی دعوت شدی! 🪙</h1>
      <p>با کد دعوت زیر در میلی ثبت‌نام کن و طبق پیشنهاد دعوت، <b>۱ میلی هدیه</b> بگیر.</p>
      <div class="gift">🎁 هدیه ثبت‌نام</div>
      <div class="code">milli-efelz</div>
      <a class="btn" href="https://milli.gold/app/sign-up?referralCode=milli-efelz" target="_blank" rel="noopener">ثبت‌نام در میلی</a>
      <p class="small">برای ثبت‌نام روی دکمه بالا بزنید. شرایط و میزان هدیه ممکن است طبق قوانین و شرایط فعلی سرویس تغییر کند.</p>
    </section>
  </main>
</body>
</html>
